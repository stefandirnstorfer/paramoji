# run with docker as
#  docker run --name nginx -p80:80 -v$(pwd)/default.conf:/etc/nginx/conf.d/default.conf -v$WWW_DIR:/usr/share/nginx/html -d nginx
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /api {
        proxy_pass http://server:3000;
    }

}
