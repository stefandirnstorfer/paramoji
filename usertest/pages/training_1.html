<html>
  <link rel="stylesheet" type="text/css" href="style.css"/>
  <meta name="viewport" content="width=400"/>
  <body>
    <h1>Training #1/3</h1>
    <form method="GET" action="http:submit">
      <div style="display:none">
	<input name="MW_ID" value="{{worker}}"/>
	<input name="CAMP_ID" value="{{campaign}}"/>
	<input name="type" value="valence"/>
      </div>
      <table>
	<tr>
	  <td colspan="6">
	    Please, compare these two emoticons.
	  </td>
	</tr>
	<tr>
	  <td colspan="3" align="left">
	    <embed src="face.svg?size=120&v=1&a=0.5&p=0.5" width="180" hight="180"/>
	  </td>
	  <td colspan="3" align="right">
	    <embed src="face.svg?size=120&v=.5&a=0.5&p=0.5" width="150" hight="150"/>
	  </td>
	</tr>
	<tr>
	  <td colspan="6">
	    <b>Valuation:</b>
	    Which of the two faces has a more positve valuation and 
	    appreciates more what it sees?
	  </td>
	</tr>
	<tr>
	  <td colspan="2" align="center">
	    <label>
	      <input type="radio" name="test" value="1"><br/>
	      Left is more positive
	    </label>
	  </td>
	  <td colspan="2" align="center">
	    <label>
	      <input type="radio" name="test" value="0.5" required><br/>
	      No difference
	    </label>
	  </td>
	  <td colspan="2" align="center">
	    <label>
	      <input type="radio" name="test" value="0"><br/>
	      Right is more positive
	    </label>
	  </td>
	</tr>
	<tr>
	  <td colspan="6" align="center">
	    <button type="submit" value="Submit">Submit</button>
	  </td>
	</tr>
      </table>
    </form>
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

      ga('create', 'UA-53997760-1', 'auto');
      ga('send', 'pageview');

    </script>
  </body>
</html>
