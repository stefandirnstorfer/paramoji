<html>
<head>
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <script src="emoticon.js"></script>
    <title>Emoticon</title>
</head>
<body id="body">
</body>
<script>
    try {
        var state = {}
        for (var key of ['v', 'a', 'p', 'c', 'e']) {
            var m = location.search.match(RegExp(key + "=([0-9]+)"));
            if (m) state[key] = parseInt(m[1]);
        }
        document.getElementById("body").innerHTML = emoticon_svg(state.v, state.a, state.p, state.c, state.e)
    } catch(e) {
        console.log(e)
        document.getElementById("body").innerText = e.message
    }
</script>
</html>
