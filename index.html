<html>
<head>
    <meta content="text/html" charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="emoticon_old.js"></script>
    <script src="emoticon.js"></script>
    <script src="controls.js"></script>
    <script src="action.js"></script>
    <title>Emoticons</title>
</head>
<script>
    function oldemo(v,a,p) {
        let svg = emoticon_svg_old(v, a, p);
        let re = /id="([^"]+)"/g;
        let ids = [];
        let m;
        while(m = re.exec(svg)) ids.push(m[1]);
        svg=svg.replace(re.compile(ids.join('|'),"g"), id => "2_"+id)
        return svg;
    }
</script>
<body>
<div id="frame">
    <div id="emoticon">
        <div data-content="oldemo(v, a, p)" data-if="#version-1" class="set-emoticon"></div>
        <div data-content="emoticon_svg(v, a, p)" data-if="#version-2" class="set-emoticon"></div>
    </div>
    <div id="control">
        <div id="dimensions">
            <h1>Controls</h1>
            <table id="sliders" width="100%">
                <tr>
                    <td>Valence</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-valence"/>
                    </td>
                    <td width="30em"><span id="label-valence">0</span></td>
                </tr>
                <tr>
                    <td>Arousal</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-arousal"/>
                    </td>
                    <td><span id="label-arousal">0</span></td>
                </tr>
                <tr>
                    <td>Potency</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-potency"/>
                    </td>
                    <td><span id="label-potency">0</span></td>
                </tr>
            </table>
        </div>
        <hr/>
        <div id="version">
            <label><input type="checkbox" id="version-1"> Version 1</label>
            <br/>
            <label><input type="checkbox" id="version-2" checked> Version 2</label>
            <br/>
            <label><input type="checkbox" id="show-controls"> Controls</label>
        </div>
        <div id="shortcuts">
            <h1>Shortcuts</h1>
            <p>
            <table class="shortcuts">
                <tr>
                    <td>
                        <button onclick="setParam(50,50,50)">Normal</button>
                    </td>
                </tr>
                <tr height="10px"/>
                <tr>
                    <td><button onclick="setParam(100,50,50)">Happy</button></td>
                    <td><button onclick="setParam(50,100,50)">Surprised</button></td>
                    <td><button onclick="setParam(50,50,100)">Determined</button></td>
                </tr>
                <tr>
                    <td><button onclick="setParam(0,50,50)">Unhappy</button></td>
                    <td><button onclick="setParam(50,0,50)">Drowsy</button></td>
                    <td><button onclick="setParam(50,50,0)">Doubtful</button></td>
                </tr>
                <tr height="10px"/>
                <tr>
                    <td><button onclick="setParam(100,100,50)">Excited</button></td>
                    <td><button onclick="setParam(50,100,100)">Alerted</button></td>
                    <td><button onclick="setParam(0,100,50)">Angry</button></td>
                </tr>
                <tr>
                    <td><button onclick="setParam(100,50,100)">Anticipating</button></td>
                    <td><button onclick="setParam(50,100,0)">Scared</button></td>
                    <td><button onclick="setParam(0,50,100)">Vengeful</button></td>
                </tr>
                <tr>
                    <td><button onclick="setParam(100,50,0)">Dreaming</button></td>
                    <td><button onclick="setParam(50,0,100)">Lurking</button></td>
                    <td><button onclick="setParam(0,50,0)">Sad</button></td>
                </tr>
                <tr>
                    <td><button onclick="setParam(100,0,50)">Content</button></td>
                    <td><button onclick="setParam(50,0,0)">Exhausted</button></td>
                    <td><button onclick="setParam(0,0,50)">Grumpy</button></td>
                </tr>
            </table>
            </p>
        </div>
        <div id="animation">
            <h1>Animation</h1>
            <label><input type="checkbox" id="animate" onchange="runAnimation(0,0,0)"> Animate</label>
            <p/>
            Speed: <input style="width:100%;min:1;max:100;value:50" type="range" id="slider-speed"/>
            <p/>
            <label><input type="checkbox" id="fix-v"> Fix valence</label>
            <br/>
            <label><input type="checkbox" id="fix-a"> Fix arousal</label>
            <br/>
            <label><input type="checkbox" id="fix-p"> Fix potency</label>
        </div>
        <div>
            <hr>
            <button onclick="save()">Save</button>
        </div>
        <div style="height:20px"></div>
    </div>
</div>
</body>
</html>
