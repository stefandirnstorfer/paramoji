<html>
<head>
    <meta content="text/html" charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="paramoji.js"></script>
    <script src="action.js"></script>
    <title>Emoticons</title>
</head>
<script>
    function oldemo(v,a,p) {
        let svg = emoticon_svg_old(v, a, p);
        let re = /id="([^"]+)"/g;
        let ids = [];
        let m;
        while(m = re.exec(svg)) ids.push(m[1]);
        svg=svg.replace(re.compile(ids.join('|'),"g"), id => "2_"+id)
        return svg;
    }
</script>
<body>
<div id="frame">
    <div id="emoticon">
        <div id="emoticon-svg"></div>
    </div>
    <div id="control">
        <div id="dimensions">
            <h1>Controls</h1>
            <table id="sliders" width="100%">
                <tr>
                    <td>Valence</td>
                    <td><button id="clear-v">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-v"/>
                    </td>
                    <td width="30em"><span id="label-v">0</span></td>
                </tr>
                <tr>
                    <td>Arousal 1</td>
                    <td><button id="clear-a1">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-a1"/>
                    </td>
                    <td><span id="label-a1">0</span></td>
                </tr>
                <tr>
                    <td>Arousal 2</td>
                    <td><button id="clear-a2">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-a2"/>
                    </td>
                    <td><span id="label-a2">0</span></td>
                </tr>
                <tr>
                    <td>Potency</td>
                    <td><button id="clear-p">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-p"/>
                    </td>
                    <td><span id="label-p">0</span></td>
                </tr>
                <tr>
                    <td>Contempt</td>
                    <td><button id="clear-c">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-c"/>
                    </td>
                    <td><span id="label-c">0</span></td>
                </tr>
            </table>
            <button onclick="setParam(50,40,0,50,0)">Reset all</button>
        </div>
        <hr/>
        <div id="animation">
            <h1>Animation</h1>
            <label><input type="checkbox" id="animate" onchange="runAnimation({})"> Animate</label>
            <p/>
            <label>
                Speed: <input style="width:90 %;min:1;max:100;value:50" type="range" id="slider-speed"/>
            </label>
            <p/>
            <label><input type="checkbox" id="fix-v"> Fix valence</label>
            <br/>
            <label><input type="checkbox" id="fix-a1"> Fix arousal</label>
            <br/>
            <label><input type="checkbox" id="fix-a2"> Fix control</label>
            <br/>
            <label><input type="checkbox" id="fix-p"> Fix potency</label>
            <br/>
            <label><input type="checkbox" id="fix-c"> Fix contempt</label>
        </div>
        <div style="height:20px"></div>
    </div>
</div>
</body>
</html>
