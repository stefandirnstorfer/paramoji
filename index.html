<html>
<head>
    <meta content="text/html" charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="paramoji.js"></script>
    <script src="controls.js"></script>
    <script src="action.js"></script>
    <title>Emoticons</title>
</head>
<script>
    function oldemo(v,a,p) {
        let svg = emoticon_svg_old(v, a, p);
        let re = /id="([^"]+)"/g;
        let ids = [];
        let m;
        while(m = re.exec(svg)) ids.push(m[1]);
        svg=svg.replace(re.compile(ids.join('|'),"g"), id => "2_"+id)
        return svg;
    }
</script>
<body>
<div id="frame">
    <div id="emoticon">
        <div id="emoticon-svg"></div>
    </div>
    <div id="control">
        <div id="dimensions">
            <h1>Controls</h1>
            <table id="sliders" width="100%">
                <tr>
                    <td>Valence</td>
                    <td><button id="clear-valence">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-valence"/>
                    </td>
                    <td width="30em"><span id="label-valence">0</span></td>
                </tr>
                <tr>
                    <td>Arousal</td>
                    <td><button id="clear-arousal">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-arousal"/>
                    </td>
                    <td><span id="label-arousal">0</span></td>
                </tr>
                <tr>
                    <td>Potency</td>
                    <td><button id="clear-potency">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-potency"/>
                    </td>
                    <td><span id="label-potency">0</span></td>
                </tr>
                <tr>
                    <td>Contempt</td>
                    <td><button id="clear-contempt">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-contempt"/>
                    </td>
                    <td><span id="label-contempt">0</span></td>
                </tr>
                <tr>
                    <td>Expression</td>
                    <td><button id="clear-expression">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-expression"/>
                    </td>
                    <td><span id="label-expression">0</span></td>
                </tr>
                <tr>
                    <td>Lips</td>
                    <td><button id="clear-lips">&times;</button></td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-lips"/>
                    </td>
                    <td><span id="label-lips">0</span></td>
                </tr>
            </table>
            <button onclick="setParam(50,50,50)">Reset all</button>
        </div>
        <hr/>
        <div id="animation">
            <h1>Animation</h1>
            <label><input type="checkbox" id="animate" onchange="runAnimation({})"> Animate</label>
            <p/>
            <label>
                Speed: <input style="width:90 %;min:1;max:100;value:50" type="range" id="slider-speed"/>
            </label>
            <p/>
            <label><input type="checkbox" id="fix-valence"> Fix valence</label>
            <br/>
            <label><input type="checkbox" id="fix-arousal"> Fix arousal</label>
            <br/>
            <label><input type="checkbox" id="fix-potency"> Fix control</label>
            <br/>
            <label><input type="checkbox" id="fix-contempt"> Fix contempt</label>
        </div>
        <div id="version">
            <hr>
            <label><input type="checkbox" id="show-controls"> Controls</label>
            <input id="controls-filter" placeholder="filter">
            <p/>
            <table id="moves" style="width:90%"/>
        </div>
        <div style="height:20px"></div>
    </div>
</div>
</body>
</html>
