<html>
<head>
    <meta content="text/html" charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="emoticon.js"></script>
    <script src="action.js"></script>
    <title>Emoticons</title>
</head>
<body>
<div id="frame">
    <div id="emoticon">
        <div id="emoticon-svg"></div>
    </div>
    <div id="control">
        <div id="dimensions">
            <h1 class="landscape-only">Controls</h1>
            <table id="sliders" width="100%">
                <tr>
                    <td>Valence</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-valence"/>
                    </td>
                    <td width="30em"><span id="label-valence">0</span></td>
                </tr>
                <tr>
                    <td>Arousal</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-arousal"/>
                    </td>
                    <td><span id="label-arousal">0</span></td>
                </tr>
                <tr>
                    <td>Control</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-potency"/>
                    </td>
                    <td><span id="label-potency">0</span></td>
                </tr>
                <tr>
                    <td>Contempt</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-contempt"/>
                    </td>
                    <td><span id="label-contempt">0</span></td>
                </tr>
                <tr>
                    <td>Expression</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-expression"/>
                    </td>
                    <td><span id="label-expression">0</span></td>
                </tr>
            </table>
        </div>
        <div id="shortcuts">
            <button onclick="setParam(50,50,50,0,50)">Normal</button>
            <button onclick="setRandomParams()">Random</button>
        </div>
    </div>
</div>
</body>
</html>
