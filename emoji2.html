<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script>
    function reorder(x1,x2,x3,x4,x5) {
        const x=[0,x1,x2,x3,x4,x5]
        const y1=x[parseInt($("input[name='v']:checked").val()) || 1]
        const y2=x[parseInt($("input[name='a1']:checked").val()) || 2]
        const y3=x[parseInt($("input[name='a2']:checked").val()) || 3]
        const y4=x[parseInt($("input[name='p']:checked").val()) || 4]
        const y5=x[parseInt($("input[name='c']:checked").val()) || 5]
        return paramoji_svg(y1,y2,y3,y4,y5)
    }
    function redrawParamoji() {
        document.querySelectorAll("[data-eval]").forEach((a, i) =>
            a.innerHTML = eval(a.getAttribute("data-eval"))
                .replace(/href="#/g, "href=\"#id-" + i + "-")
                .replace(/\(#/g, "(#id-" + i + "-")
                .replace(/id="/g, "id=\"id-" + i + "-"))
    }

    let baseurl = "http://localhost/emoticon-data/emoji/"
    document.querySelectorAll("[data-code]").forEach((a,i) =>
        a.setAttribute('src', baseurl+"emoji_u"+a.getAttribute('data-code')+'.svg'))
    redrawParamoji()
    $('input').bind('click', redrawParamoji)
</script>
