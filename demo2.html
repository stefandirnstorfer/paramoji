<html>
<head>
    <meta content="text/html" charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <script src="jquery.js"></script>
    <script src="gen/emoticon.js"></script>
    <script src="gen/emoticon2.js"></script>
    <script src="action.js"></script>
    <title>Emoticons</title>
</head>
<script>
    function myemo(v,a,p) {
        let svg = emoticon_svg_raw2(v, a, p);
        let re = /id="([^"]+)"/g;
        let ids = [];
        let m;
        while(m = re.exec(svg)) ids.push(m[1]);
        for (let id of ids) svg=svg.replace(re.compile(id,"g"), "2"+id)
        return svg;
    }
</script>
<body>
<div id="frame">
    <div id="emoticon" data-content="emoticon_svg_raw(v, a, p) + myemo(v, a, p)">
        <div id="svg-frame"></div>
    </div>
    <div id="control">
        <div id="dimensions">
            <h1>Controls</h1>
            <table id="sliders" width="100%">
                <tr>
                    <td>Valence</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-valence"/>
                    </td>
                    <td width="30em"><span id="label-valence">0</span></td>
                </tr>
                <tr>
                    <td>Arousal</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-arousal"/>
                    </td>
                    <td><span id="label-arousal">0</span></td>
                </tr>
                <tr>
                    <td>Potency</td>
                    <td>
                        <input style="width:90%;min:0;max:100;value:50" type="range" id="slider-potency"/>
                    </td>
                    <td><span id="label-potency">0</span></td>
                </tr>
            </table>
        </div>
        <div id="shortcuts">
            <h1>Shortcuts</h1>
            <p>
            <table>
                <tr>
                    <td>
                        <a href="javascript:setParam(50,50,50)">Normal</a>
                    </td>
                </tr>
            </table>
            </p>
            <p>
            <table>
                <tr>
                    <td><a href="javascript:setParam(100,50,50)">Happy</a></td>
                    <td><a href="javascript:setParam(50,100,50)">Surprised</a></td>
                    <td><a href="javascript:setParam(50,50,100)">Determined</a></td>
                </tr>
                <tr>
                    <td><a href="javascript:setParam(0,50,50)">Unhappy</a></td>
                    <td><a href="javascript:setParam(50,0,50)">Drowsy</a></td>
                    <td><a href="javascript:setParam(50,50,0)">Doubtful</a></td>
                </tr>
            </table>
            </p>
            <p>
            <table>
                <tr>
                    <td><a href="javascript:setParam(100,100,50)">Excited</a></td>
                    <td><a href="javascript:setParam(50,100,100)">Alerted</a></td>
                    <td><a href="javascript:setParam(0,100,50)">Angry</a></td>
                </tr>
                <tr>
                    <td><a href="javascript:setParam(100,50,100)">Anticipating</a></td>
                    <td><a href="javascript:setParam(50,100,0)">Scared</a></td>
                    <td><a href="javascript:setParam(0,50,100)">Vengeful</a></td>
                </tr>
                <tr>
                    <td><a href="javascript:setParam(100,50,0)">Dreaming</a></td>
                    <td><a href="javascript:setParam(50,0,100)">Lurking</a></td>
                    <td><a href="javascript:setParam(0,50,0)">Sad</a></td>
                </tr>
                <tr>
                    <td><a href="javascript:setParam(100,0,50)">Content</a></td>
                    <td><a href="javascript:setParam(50,0,0)">Exhausted</a></td>
                    <td><a href="javascript:setParam(0,0,50)">Grumpy</a></td>
                </tr>
            </table>
            </p>
        </div>
        <div id="animation">
            <h1>Animation</h1>
            <label><input type="checkbox" id="animate" onchange="runAnimation(0,0,0)">Animate</label>
            <p/>
            Speed: <input style="width:100%;min:1;max:100;value:50" type="range" id="slider-speed"/>
            <p/>
            <label><input type="checkbox" id="fix-v">Fix valence</label>
            <br/>
            <label><input type="checkbox" id="fix-a">Fix arousal</label>
            <br/>
            <label><input type="checkbox" id="fix-p">Fix potency</label>
        </div>
    </div>
</div>
</body>
</html>
